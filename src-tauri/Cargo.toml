[package]
name = "medirec"
version = "0.1.0"
edition = "2021"
description = "Graba o elige audio, transcríbelo sin internet y expórtalo a PDF"
authors = ["Pau Pedros"]
license = "MIT"
repository = "https://github.com/paupedros/medirec"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac"] }
whisper-rs = "0.16"
printpdf = "0.7"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
